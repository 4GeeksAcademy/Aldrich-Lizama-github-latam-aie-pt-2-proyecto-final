[project]
name = "nexova-api"
version = "1.1.0"
description = "Nexova API — Incidencias y Proveedores"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "tinydb>=4.9.0",
    "pydantic>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1,>=4.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
seed = "services.api.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]